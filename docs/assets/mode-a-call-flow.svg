<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Mode A call flow: the Witness conducts call 06</title>
  <desc id="d">A real run of the scripted call. The Witness discloses it is an AI, asks for identity, asks for status, challenges the same-badge contradiction from July 8, probes the August 5 call, follows the refusal chain, reads back the reference number, and closes only when the gate is clear.</desc>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="40" y="40" font-size="22" font-weight="700" fill="#111">Mode A, one real run: the Witness conducts the call</text>
  <text x="40" y="64" font-size="14" fill="#555">Claim A-4471-08, call 06, 49 days after the same badge said something else. Lines are taken from the test run, not written for the diagram.</text>

  <g font-size="13" font-weight="700" fill="#111">
    <text x="60" y="104">THE WITNESS (AI, speaks to the Rep)</text>
    <text x="640" y="104">THE REP (payer)</text>
    <text x="480" y="104" fill="#777" font-weight="600">Ledger</text>
  </g>
  <line x1="450" y1="112" x2="450" y2="730" stroke="#ddd"/>
  <line x1="620" y1="112" x2="620" y2="730" stroke="#ddd"/>

  <g font-size="12.5">
    <!-- step rows: y spacing 58 -->
    <rect x="40" y="120" width="390" height="44" fill="#e8f0fb" stroke="#1f5fae"/>
    <text x="50" y="138" fill="#0d3a73" font-weight="700">1 Greeting (verbatim)</text>
    <text x="50" y="154" fill="#123">"This is an AI assistant... This call is being recorded."</text>
    <rect x="640" y="120" width="520" height="44" fill="#f4f1ea" stroke="#333"/>
    <text x="650" y="147" font-style="italic" fill="#111">"This is Darnell, badge two-two-one-zero."</text>
    <text x="470" y="147" fill="#1c6b3f">+ identity</text>

    <rect x="40" y="178" width="390" height="44" fill="#e8f0fb" stroke="#1f5fae"/>
    <text x="50" y="196" fill="#0d3a73" font-weight="700">2 Verify claim, ask status</text>
    <text x="50" y="212" fill="#123">member ID and date of service from the call brief</text>
    <rect x="640" y="178" width="520" height="44" fill="#f4f1ea" stroke="#333"/>
    <text x="650" y="205" font-style="italic" fill="#111">"That claim denied. Timely filing."   (hold 4m 02s)</text>
    <text x="470" y="205" fill="#1c6b3f">+ reason</text>

    <rect x="40" y="236" width="390" height="62" fill="#fdecea" stroke="#b3261e" stroke-width="2"/>
    <text x="50" y="254" fill="#8a1a14" font-weight="700">3 CHALLENGE: value conflict, same badge</text>
    <text x="50" y="270" fill="#123">"On July eighth, D. Reese, badge two two one zero,</text>
    <text x="50" y="286" fill="#123">reference eight K two J three three eight, said no prior authorization."</text>
    <rect x="640" y="236" width="520" height="44" fill="#f4f1ea" stroke="#333"/>
    <text x="650" y="263" font-style="italic" fill="#111">"I'm showing timely filing today."</text>
    <text x="470" y="263" fill="#b3261e">flag, 90</text>

    <rect x="40" y="310" width="390" height="44" fill="#e8f0fb" stroke="#1f5fae"/>
    <text x="50" y="328" fill="#0d3a73" font-weight="700">4 Probe a prior call on record</text>
    <text x="50" y="344" fill="#123">"On August fifth, T. Okafor... recorded reprocessed."</text>
    <rect x="640" y="310" width="520" height="44" fill="#f4f1ea" stroke="#333"/>
    <text x="650" y="337" font-style="italic" fill="#111">"I don't have a record of a call on August fifth."</text>

    <rect x="40" y="368" width="390" height="62" fill="#fdecea" stroke="#b3261e" stroke-width="2"/>
    <text x="50" y="386" fill="#8a1a14" font-weight="700">5 CHALLENGE: existence denial</text>
    <text x="50" y="402" fill="#123">"Our record shows a call on August fifth, reference</text>
    <text x="50" y="418" fill="#123">eight K two J seven zero two. Can you look up that reference?"</text>
    <text x="470" y="337" fill="#b3261e">flag, 100</text>
    <rect x="640" y="368" width="520" height="44" fill="#f4f1ea" stroke="#333"/>
    <text x="650" y="395" font-style="italic" fill="#111">"I'd have to look into that."</text>

    <rect x="40" y="444" width="390" height="44" fill="#e8f0fb" stroke="#1f5fae"/>
    <text x="50" y="462" fill="#0d3a73" font-weight="700">6 Ask the remit reason</text>
    <text x="50" y="478" fill="#123">deterministic objective from the call brief</text>
    <rect x="640" y="444" width="520" height="44" fill="#f4f1ea" stroke="#333"/>
    <text x="650" y="471" font-style="italic" fill="#111">"There's also a diagnosis issue on it."</text>
    <text x="470" y="471" fill="#1c6b3f">+ 2nd reason</text>

    <rect x="40" y="502" width="390" height="44" fill="#e8f0fb" stroke="#1f5fae"/>
    <text x="50" y="520" fill="#0d3a73" font-weight="700">7 Ask which diagnosis code</text>
    <text x="50" y="536" fill="#123">follow-up chosen because a diagnosis reason exists</text>
    <rect x="640" y="502" width="520" height="44" fill="#f4f1ea" stroke="#333"/>
    <text x="650" y="529" font-style="italic" fill="#111">"It doesn't specify on my screen."</text>
    <text x="470" y="529" fill="#b3261e">refusal row</text>

    <rect x="40" y="560" width="390" height="44" fill="#e8f0fb" stroke="#1f5fae"/>
    <text x="50" y="578" fill="#0d3a73" font-weight="700">8 Ask the remark code</text>
    <text x="50" y="594" fill="#123">absence is evidence: recorded, not skipped</text>
    <rect x="640" y="560" width="520" height="44" fill="#f4f1ea" stroke="#333"/>
    <text x="650" y="587" font-style="italic" fill="#111">"I'd have to refer you to the denial letter."</text>
    <text x="470" y="587" fill="#b3261e">refusal row</text>

    <rect x="40" y="618" width="390" height="44" fill="#e8f0fb" stroke="#1f5fae"/>
    <text x="50" y="636" fill="#0d3a73" font-weight="700">9 Reference number, then read back</text>
    <text x="50" y="652" fill="#123">"Let me read that back: eight K two J nine eight eight."</text>
    <rect x="640" y="618" width="520" height="44" fill="#f4f1ea" stroke="#333"/>
    <text x="650" y="645" font-style="italic" fill="#111">"Eight-K-two-J, nine-eight-eight."  then  "That's correct."</text>
    <text x="470" y="645" fill="#1c6b3f">unconfirmed, then confirmed</text>

    <rect x="40" y="676" width="1120" height="52" fill="#e9f5ee" stroke="#1c6b3f" stroke-width="2"/>
    <text x="50" y="696" fill="#134d2c" font-weight="700">10 Gate clear: rep, badge and reference captured, refusals on record. Recap spoken, session ends.</text>
    <text x="50" y="714" fill="#123">If the reference number is still missing after two asks, the plan does not close: it alerts the Agent to Take Over.</text>
  </g>
</svg>
