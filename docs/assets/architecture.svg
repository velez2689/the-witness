<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">The Witness architecture</title>
  <desc id="d">The Rep's audio goes to AssemblyAI. Our code extracts statements into an append-only ledger, the contradiction engine and call plan decide what happens next, and speech is assembled from recorded rows. In Mode A the Witness speaks to the Rep. In Mode B it whispers to the Agent.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#333"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b3261e"/></marker>
  </defs>
  <rect width="1200" height="640" fill="#ffffff"/>
  <text x="40" y="40" font-size="22" font-weight="700" fill="#111">How The Witness works</text>
  <text x="40" y="64" font-size="14" fill="#555">One pipeline, two modes. The model is a mouth, not a hand: every fact it speaks is assembled by our code from a recorded row.</text>

  <!-- column headers -->
  <g font-size="12" fill="#777" font-weight="600">
    <text x="40" y="104">1  AUDIO IN</text>
    <text x="300" y="104">2  ASSEMBLYAI</text>
    <text x="580" y="104">3  OUR CODE (deterministic, no LLM decides)</text>
    <text x="960" y="104">4  OUT</text>
  </g>

  <!-- 1 audio -->
  <rect x="40" y="120" width="200" height="90" fill="#f4f1ea" stroke="#333"/>
  <text x="56" y="148" font-size="15" font-weight="700" fill="#111">Rep (payer line)</text>
  <text x="56" y="168" font-size="12.5" fill="#444">a person or the Rep Simulator</text>
  <text x="56" y="186" font-size="12.5" fill="#444">Chrome, PCM16 24 kHz</text>
  <rect x="40" y="340" width="200" height="90" fill="#f4f1ea" stroke="#333"/>
  <text x="56" y="368" font-size="15" font-weight="700" fill="#111">Agent (you)</text>
  <text x="56" y="388" font-size="12.5" fill="#444">Mode B only: your mic in,</text>
  <text x="56" y="406" font-size="12.5" fill="#444">private earpiece out</text>

  <!-- 2 assemblyai -->
  <rect x="300" y="120" width="240" height="110" fill="#e8f0fb" stroke="#1f5fae" stroke-width="2"/>
  <text x="316" y="146" font-size="15" font-weight="700" fill="#0d3a73">Voice Agent API</text>
  <text x="316" y="166" font-size="12.5" fill="#123">Mode A: one session on the Rep's</text>
  <text x="316" y="182" font-size="12.5" fill="#123">audio. Greeting spoken verbatim.</text>
  <text x="316" y="204" font-size="12" fill="#345">keyterms seeded from the claim</text>
  <rect x="300" y="250" width="240" height="70" fill="#e8f0fb" stroke="#1f5fae"/>
  <text x="316" y="276" font-size="15" font-weight="700" fill="#0d3a73">Streaming STT v3</text>
  <text x="316" y="296" font-size="12.5" fill="#123">Mode B: Rep audio, listen-only</text>
  <rect x="300" y="340" width="240" height="90" fill="#e8f0fb" stroke="#1f5fae"/>
  <text x="316" y="366" font-size="15" font-weight="700" fill="#0d3a73">Voice Agent API</text>
  <text x="316" y="386" font-size="12.5" fill="#123">Mode B: reply.create speaks the</text>
  <text x="316" y="402" font-size="12.5" fill="#123">whisper, only into the earpiece</text>

  <!-- 3 our code -->
  <rect x="580" y="120" width="340" height="320" fill="#faf8f3" stroke="#333" stroke-dasharray="5 4"/>
  <rect x="600" y="140" width="140" height="52" fill="#fff" stroke="#333"/>
  <text x="612" y="162" font-size="13.5" font-weight="700" fill="#111">Extractor</text>
  <text x="612" y="180" font-size="11.5" fill="#444">final turns only</text>
  <rect x="770" y="140" width="130" height="52" fill="#e8f0fb" stroke="#1f5fae" stroke-width="2"/>
  <text x="782" y="162" font-size="13.5" font-weight="700" fill="#0d3a73">Ledger</text>
  <text x="782" y="180" font-size="11.5" fill="#345">append-only, hashed</text>
  <rect x="600" y="230" width="140" height="56" fill="#fdecea" stroke="#b3261e" stroke-width="2"/>
  <text x="612" y="252" font-size="13.5" font-weight="700" fill="#8a1a14">Contradiction</text>
  <text x="612" y="268" font-size="13.5" font-weight="700" fill="#8a1a14">engine</text>
  <text x="770" y="246" font-size="11.5" fill="#444">5 kinds + refusals,</text>
  <text x="770" y="262" font-size="11.5" fill="#444">derived from the log</text>
  <rect x="600" y="320" width="140" height="52" fill="#fff" stroke="#333"/>
  <text x="612" y="342" font-size="13.5" font-weight="700" fill="#111">Call plan</text>
  <text x="612" y="360" font-size="11.5" fill="#444">what to ask or whisper</text>
  <rect x="770" y="320" width="130" height="52" fill="#fff" stroke="#333"/>
  <text x="782" y="342" font-size="13.5" font-weight="700" fill="#111">Speech</text>
  <text x="782" y="360" font-size="11.5" fill="#444">built from rows</text>
  <text x="600" y="412" font-size="11.5" fill="#444">Self-check: every number spoken must</text>
  <text x="600" y="428" font-size="11.5" fill="#444">exist in the ledger or the call brief.</text>

  <!-- 4 out -->
  <rect x="960" y="120" width="200" height="70" fill="#e9f5ee" stroke="#1c6b3f" stroke-width="2"/>
  <text x="974" y="146" font-size="14" font-weight="700" fill="#134d2c">Mode A: Witness</text>
  <text x="974" y="164" font-size="12.5" fill="#123">speaks to the Rep, challenges</text>
  <text x="974" y="180" font-size="12.5" fill="#123">on the recorded line</text>
  <rect x="960" y="340" width="200" height="90" fill="#fff8e6" stroke="#8a5a00" stroke-width="2"/>
  <text x="974" y="366" font-size="14" font-weight="700" fill="#5c3c00">Mode B: whisper</text>
  <text x="974" y="384" font-size="12.5" fill="#123">tells the Agent what to ask,</text>
  <text x="974" y="400" font-size="12.5" fill="#123">what to question, what is</text>
  <text x="974" y="416" font-size="12.5" fill="#123">still missing</text>
  <rect x="960" y="230" width="200" height="90" fill="#f4f1ea" stroke="#333"/>
  <text x="974" y="256" font-size="14" font-weight="700" fill="#111">Every mode</text>
  <text x="974" y="274" font-size="12.5" fill="#333">Evidence console</text>
  <text x="974" y="290" font-size="12.5" fill="#333">Claim update sheet</text>
  <text x="974" y="306" font-size="12.5" fill="#333">Appeal packet (verifiable hash)</text>

  <!-- arrows -->
  <g stroke="#333" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M240 160 H300"/>
    <path d="M240 285 H300"/>
    <path d="M540 165 H600" />
    <path d="M540 285 H580 V166 H600"/>
    <path d="M740 166 H770"/>
    <path d="M835 192 V210 H670 V230"/>
    <path d="M670 286 V320"/>
    <path d="M740 346 H770"/>
    <path d="M240 385 H300"/>
  </g>
  <path d="M900 346 H940 V155 H960" stroke="#1c6b3f" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
  <path d="M900 360 H960" stroke="#8a5a00" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
  <path d="M900 166 H930 V270 H960" stroke="#333" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
  <path d="M540 385 H580" stroke="#8a5a00" stroke-width="0" fill="none"/>
  <!-- speech back through AssemblyAI -->
  <path d="M600 440 V470 H420 V232" stroke="#b3261e" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#r)"/>
  <path d="M420 470 V432" stroke="#b3261e" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#r)"/>
  <text x="440" y="490" font-size="12" fill="#8a1a14">reply.create with one-shot instructions: "Say exactly the following". Text assembled by our code.</text>

  <!-- footer rules -->
  <line x1="40" y1="520" x2="1160" y2="520" stroke="#ddd"/>
  <g font-size="13" fill="#222">
    <text x="40" y="548" font-weight="700">Guarantees enforced in code and tests</text>
    <text x="40" y="572">Append-only ledger; a read-back confirmation is a new row, never an edit.</text>
    <text x="40" y="592">The voice agent never writes to the ledger. It cannot call tools on this account.</text>
    <text x="40" y="612">Sessions end on every exit path: user stop, plan done, error, hard timeout, page exit.</text>
    <text x="640" y="572">Mode A discloses "AI assistant" and "recorded" in a verbatim greeting.</text>
    <text x="640" y="592">Mode B routes the Witness voice only to the Agent's earpiece.</text>
    <text x="640" y="612">No accuracy percentages anywhere. Confidence is a state, never a number.</text>
  </g>
</svg>
